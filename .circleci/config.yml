version: 2
jobs:
  build:
    docker:
      - image: maven:3.9.9-eclipse-temurin-8
    environment:
      MAVEN_OPTS: "-Xmx1024m"
    resource_class: small
    parallelism: 1
    branches:
      ignore:
        - gh-pages
    steps:
      - checkout
      - restore_cache:
          key: config-java8-v1-{{ checksum "pom.xml" }}
      - run:
          name: "Formatting and fast behavior units"
          command: >
            mvn -B -ntp -pl spring-cloud-config-server -am
            -Dtest=AwsS3EnvironmentRepositoryTests,AwsS3CompatibilityTests,JGitSubmoduleCompatibilityTests,SshTransportModuleCompatibilityTests,PropertyBasedSshSessionFactoryTest,SshPropertyValidatorTest,SshUriPropertyProcessorTest
            -Dsurefire.failIfNoSpecifiedTests=false test
      - save_cache:
          key: config-java8-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
